version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: aiom-backend-app
    container_name: aiom-backend-app
    restart: unless-stopped
    env_file: .env
    expose:
      - ${PORT}
    depends_on:
      - postgres
    networks:
      - dokploy-network

  postgres:
    image: postgres:14-alpine
    container_name: aiom-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DOCKER_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${DOCKER_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${DOCKER_POSTGRES_DB}"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - dokploy-network
    ports:
      - "${DOCKER_POSTGRES_PORT}:5432"

volumes:
  postgres-data:

networks:
  dokploy-network:
    external: true
